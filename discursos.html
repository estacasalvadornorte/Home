<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário de Discursos – Estaca Salvador Brasil Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O cabeçalho é montado automaticamente pelo arquivo componentes.js.
       Não edite aqui. Para mudar o menu, abra componentes.js -->
  <div id="cabecalho"></div>

  <main>
    <section class="page-hero">
      <h1>Calendário de Discursos</h1>
      <p>Designações de oradores da estaca para o terceiro domingo de cada mês</p>
    </section>

    <div class="container">

      <!--
        ╔══════════════════════════════════════════════════════════════════╗
        ║  COMO ALTERAR O CALENDÁRIO DE DISCURSOS                          ║
        ║                                                                  ║
        ║  Você NÃO edita nada nesta página, nem no GitHub.                ║
        ║                                                                  ║
        ║  Entre em Área da Liderança > Discursos nas Alas, digite o       ║
        ║  código e altere por lá. O que você salvar aparece aqui.         ║
        ║                                                                  ║
        ║  A página abre sempre no mês corrente.                           ║
        ╚══════════════════════════════════════════════════════════════════╝
      -->

      <div class="cal-abas">
        <button class="cal-aba disc-aba ativo" data-visao="mes">Por mês</button>
        <button class="cal-aba disc-aba" data-visao="ano">Ano inteiro</button>
      </div>

      <div id="disc-conteudo">
        <p class="cal-vazio">Carregando os discursos...</p>
      </div>

    </div>
  </main>

  <!-- O rodapé é montado automaticamente pelo arquivo componentes.js -->
  <div id="rodape"></div>

  <script src="componentes.js"></script>
  <script src="discursos.js"></script>
</body>
</html>
