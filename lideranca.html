<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liderança – Estaca Salvador Brasil Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O cabeçalho é montado automaticamente pelo arquivo componentes.js.
       Não edite aqui. Para mudar o menu, abra componentes.js -->
  <div id="cabecalho"></div>

  <main>
    <section class="page-hero">
      <h1>Liderança da Estaca</h1>
      <p>Presidência, secretariado e sumo conselho</p>
    </section>

    <div class="container">

      <!--
        ╔══════════════════════════════════════════════════════════════════╗
        ║  COMO ALTERAR A LIDERANÇA                                        ║
        ║                                                                  ║
        ║  Você NÃO edita nada nesta página.                               ║
        ║  Os dados ficam na pasta lideranca/, em três arquivos:           ║
        ║                                                                  ║
        ║    pessoas.csv      quem ocupa cada um dos 19 cargos             ║
        ║    designacoes.csv  catálogo de todas as designações             ║
        ║    vinculos.csv     quem responde por cada designação            ║
        ║                                                                  ║
        ║  TROCAR UMA PESSOA DE CARGO:                                     ║
        ║    Abra lideranca/pessoas.csv, mude o nome e a data.             ║
        ║    O cargo na primeira coluna nunca muda.                        ║
        ║                                                                  ║
        ║  TROCAR DESIGNAÇÕES ENTRE AS PESSOAS:                            ║
        ║    Use o editor. Ele monta o vinculos.csv pronto para você       ║
        ║    colar no GitHub. O endereço do editor está anotado no         ║
        ║    arquivo lideranca/COMO-EDITAR-LIDERANCA.txt                   ║
        ║                                                                  ║
        ║  TROCAR UMA FOTO:                                                ║
        ║    Suba a foto nova em imagens/chamados/ com o MESMO nome        ║
        ║    de arquivo que já está lá. Não precisa mexer em código.       ║
        ╚══════════════════════════════════════════════════════════════════╝
      -->

      <div class="lid-abas">
        <button class="lid-aba ativo" data-visao="pessoas">Por pessoa</button>
        <button class="lid-aba" data-visao="designacoes">Por designação</button>
      </div>

      <div id="lid-conteudo">
        <p class="cal-vazio">Carregando liderança...</p>
      </div>

    </div>
  </main>

  <!-- O rodapé é montado automaticamente pelo arquivo componentes.js -->
  <div id="rodape"></div>

  <script src="componentes.js"></script>
  <script src="csv.js"></script>
  <script src="lideranca.js"></script>
</body>
</html>
