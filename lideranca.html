<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liderança – Estaca Salvador Brasil Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O cabeçalho é montado automaticamente pelo arquivo componentes.js.
       Não edite aqui. Para mudar o menu, abra componentes.js -->
  <div id="cabecalho"></div>

  <main>
    <section class="page-hero">
      <h1>Liderança da Estaca</h1>
      <p>Presidência da estaca e membros do sumo conselho</p>
    </section>

    <div class="container">

      <!--
        ╔══════════════════════════════════════════════════════════╗
        ║  COMO COLOCAR A LIDERANÇA DO CANVA:                     ║
        ║                                                          ║
        ║  1. Abra o design da liderança no Canva                  ║
        ║  2. Clique em "Compartilhar" (canto superior direito)    ║
        ║  3. Clique em "Mais..."                                  ║
        ║  4. Clique em "Incorporar"                               ║
        ║  5. Clique em "Código de incorporação inteligente"       ║
        ║  6. Copie TODO o código que aparece                      ║
        ║  7. Apague tudo entre INICIO e FIM abaixo               ║
        ║  8. Cole o código copiado no lugar                       ║
        ╚══════════════════════════════════════════════════════════╝
      -->

      <!-- ========== INICIO DO EMBED DO CANVA (apague daqui...) ========== -->
      <div class="embed-wrapper">
        <div class="embed-placeholder">
          <div class="placeholder-icon">👤</div>
          <p>Aqui vai aparecer a liderança da estaca após inserir o código do Canva.</p>
        </div>
      </div>
      <!-- ========== FIM DO EMBED DO CANVA (...até aqui) ========== -->

    </div>
  </main>

  <!-- O rodapé é montado automaticamente pelo arquivo componentes.js -->
  <div id="rodape"></div>

  <script src="componentes.js"></script>
</body>
</html>
