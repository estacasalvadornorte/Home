  <!-- Daqui para baixo não precisa mexer -->
  <script>
    function toggleAccordion(header) {
      const item = header.parentElement;
      const isOpen = item.classList.contains('open');

      // Fecha todos os outros
      document.querySelectorAll('.accordion-item.open').forEach(function (openItem) {
        if (openItem !== item) fecharTreinamento(openItem);
      });

      // Abre ou fecha o clicado
      if (isOpen) {
        fecharTreinamento(item);
      } else {
        abrirTreinamento(item);
      }
    }

    function abrirTreinamento(item) {
      const body = item.querySelector('.accordion-body');
      item.classList.add('open');
      body.style.maxHeight = body.scrollHeight + 'px';

      // Depois de abrir, libera a altura para acompanhar a tela (ex.: girar o celular)
      setTimeout(function () {
        if (item.classList.contains('open')) body.style.maxHeight = 'none';
      }, 400);
    }

    function fecharTreinamento(item) {
      const body = item.querySelector('.accordion-body');
      body.style.maxHeight = body.scrollHeight + 'px';
      void body.offsetHeight;
      body.style.maxHeight = null;
      item.classList.remove('open');

      // Recarrega o vídeo ou a apresentação para parar o som ao fechar
      item.querySelectorAll('iframe').forEach(function (quadro) {
        quadro.src = quadro.src;
      });
    }

    // Transforma o link de compartilhamento do Drive no endereço do player
    function linkDoDrive(link) {
      let m = link.match(/drive\.google\.com\/file\/d\/([\w-]+)/i) ||
              link.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#\s]*&)?id=([\w-]+)/i);
      if (m) {
        const chave = link.match(/[?&]resourcekey=([\w-]+)/i);
        return 'https://drive.google.com/file/d/' + m[1] + '/preview' +
               (chave ? '?resourcekey=' + chave[1] : '');
      }

      // PowerPoint que o Drive converteu para Apresentações Google
      m = link.match(/docs\.google\.com\/(presentation|document)\/d\/([\w-]+)/i);
      if (m && m[2] !== 'e') {
        return 'https://docs.google.com/' + m[1] + '/d/' + m[2] + '/preview';
      }
      return null;
    }

    // Olha o conteúdo de cada treinamento:
    // código do Canva fica como está; link do Drive vira o player
    function prepararTreinamentos() {
      document.querySelectorAll('.accordion .embed-wrapper').forEach(function (caixa) {
        if (!caixa.querySelector('iframe')) {
          const texto = caixa.textContent;
          const achado = texto.match(/https?:\/\/(?:drive|docs)\.google\.com\/\S+/i);

          if (achado && linkDoDrive(achado[0])) {
            const quadro = document.createElement('iframe');
            quadro.src = linkDoDrive(achado[0]);
            quadro.setAttribute('allow', 'autoplay; fullscreen');
            quadro.setAttribute('allowfullscreen', '');
            quadro.setAttribute('loading', 'lazy');

            const player = document.createElement('div');
            player.className = 'drive-player';
            player.appendChild(quadro);

            caixa.innerHTML = '';
            caixa.appendChild(player);
          } else if (/https?:\/\//i.test(texto)) {
            caixa.innerHTML =
              '<div class="embed-placeholder"><p>Link não reconhecido. ' +
              'Use o código de incorporação do Canva ou o link de ' +
              'compartilhamento do Google Drive.</p></div>';
          }
        }

        if (caixa.querySelector('iframe')) {
          caixa.classList.add('tem-conteudo');
          const aviso = caixa.querySelector('.embed-placeholder');
          if (aviso) aviso.remove();
        }
      });
    }

    prepararTreinamentos();
  </script>
