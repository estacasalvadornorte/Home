<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treinamentos – Estaca Salvador Brasil Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O cabeçalho é montado automaticamente pelo arquivo componentes.js.
       Não edite aqui. Para mudar o menu, abra componentes.js -->
  <div id="cabecalho"></div>

  <main>
    <section class="page-hero">
      <h1>Treinamentos</h1>
      <p>Materiais de capacitação da estaca</p>
    </section>

    <div class="container">

      <!--
        ╔══════════════════════════════════════════════════════════════════╗
        ║  COMO ADICIONAR OU ALTERAR TREINAMENTOS                          ║
        ║                                                                  ║
        ║  Você NÃO edita nada nesta página.                               ║
        ║  Todos os treinamentos ficam no arquivo:  treinamentos.csv       ║
        ║  Cada linha do arquivo é um treinamento.                         ║
        ║                                                                  ║
        ║  COLUNAS                                                         ║
        ║    aba        nome da aba onde ele aparece                       ║
        ║               (Por chamado, Treinamentos gerais...)              ║
        ║               Um nome novo cria uma aba nova sozinho.            ║
        ║    titulo     nome do treinamento                                ║
        ║    descricao  uma frase curta sobre o conteúdo                   ║
        ║               Se tiver vírgula, coloque o texto entre aspas.     ║
        ║    tipo       Vídeo, Apresentação ou Canva                       ║
        ║    link       endereço do material (veja abaixo)                 ║
        ║                                                                  ║
        ║  VÍDEO OU POWERPOINT NO GOOGLE DRIVE                             ║
        ║    1. Suba o arquivo no Google Drive                             ║
        ║    2. Clique com o botão direito no arquivo > Compartilhar       ║
        ║    3. Em "Acesso geral", troque "Restrito" por                   ║
        ║       "Qualquer pessoa com o link", como Leitor                  ║
        ║    4. Clique em "Copiar link" e cole na coluna link              ║
        ║                                                                  ║
        ║  CANVA                                                           ║
        ║    1. No design, clique em Compartilhar > Mais > Incorporar      ║
        ║    2. Copie o link que termina em view?embed                     ║
        ║       Se aparecer só o código, copie o endereço entre            ║
        ║       src="  e  "                                                ║
        ║    Nunca use o link de edição do Canva.                          ║
        ║                                                                  ║
        ║  YOUTUBE                                                         ║
        ║    Cole o link do vídeo como está.                               ║
        ║                                                                  ║
        ║  A página atualiza sozinha em 1 a 2 minutos após salvar.         ║
        ╚══════════════════════════════════════════════════════════════════╝
      -->

      <div class="abas" id="trein-abas" role="tablist"></div>

      <div class="accordion" id="trein-lista">
        <p class="cal-vazio">Carregando treinamentos...</p>
      </div>

    </div>
  </main>

  <!-- O rodapé é montado automaticamente pelo arquivo componentes.js -->
  <div id="rodape"></div>

  <script src="componentes.js"></script>
  <script src="csv.js"></script>
  <script src="treinamentos.js"></script>
</body>
</html>
