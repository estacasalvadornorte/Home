<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendário – Estaca Salvador Brasil Norte</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O cabeçalho é montado automaticamente pelo arquivo componentes.js.
       Não edite aqui. Para mudar o menu, abra componentes.js -->
  <div id="cabecalho"></div>

  <main>
    <section class="page-hero">
      <h1>Calendário da Estaca</h1>
      <p>Reuniões, conferências, treinamentos e atividades</p>
    </section>

    <div class="container">

      <!--
        ╔══════════════════════════════════════════════════════════════════╗
        ║  COMO ALTERAR OS EVENTOS DESTE CALENDÁRIO                        ║
        ║                                                                  ║
        ║  Você NÃO edita nada nesta página, nem no GitHub.                ║
        ║                                                                  ║
        ║  Entre em Área da Liderança > Calendário da Estaca,              ║
        ║  digite o código e crie, altere ou exclua os eventos por lá.     ║
        ║  O que você salvar aparece aqui em seguida.                      ║
        ║                                                                  ║
        ║  Os eventos ficam guardados na planilha do Google.               ║
        ║  O arquivo calendario.csv continua no site só como reserva,      ║
        ║  para o calendário não sumir se a planilha ficar fora do ar.     ║
        ╚══════════════════════════════════════════════════════════════════╝
      -->

      <div class="cal-abas">
        <button class="cal-aba ativo" data-visao="proximos">Próximos</button>
        <button class="cal-aba" data-visao="mes">Por mês</button>
        <button class="cal-aba" data-visao="ano">Ano inteiro</button>
      </div>

      <div class="cal-filtros" id="cal-filtros"></div>

      <div id="cal-conteudo">
        <p class="cal-vazio">Carregando calendário...</p>
      </div>

      <div class="cal-legenda">
        <span class="cal-legenda-item tipo-reuniao">Reunião</span>
        <span class="cal-legenda-item tipo-treinamento">Treinamento</span>
        <span class="cal-legenda-item tipo-conferencia">Conferência</span>
        <span class="cal-legenda-item tipo-atividade">Atividade</span>
      </div>

    </div>
  </main>

  <!-- O rodapé é montado automaticamente pelo arquivo componentes.js -->
  <div id="rodape"></div>

  <script src="componentes.js"></script>
  <script src="calendario.js"></script>
</body>
</html>
